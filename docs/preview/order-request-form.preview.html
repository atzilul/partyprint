<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PARTYPRINT — מצבי רכיב הטופס</title><link rel="stylesheet" href="../../components/order-flow.css"><style>body{margin:0;background:var(--color-pp-canvas)}main{max-width:700px;margin:40px auto;padding:24px}.demo-row{display:grid;grid-template-columns:90px minmax(0,1fr);gap:16px;margin:24px 0;align-items:center}.demo-row label{font-weight:700}.demo-preview{display:grid;gap:12px}.demo-preview input{width:100%}@media(max-width:500px){.demo-row{grid-template-columns:minmax(0,1fr)}}</style><main class="pp-order-flow pp-request"><h1>טופס PARTYPRINT — מצבי הממשק</h1><p>עזר פיתוח בלבד; אינו נתיב באתר ואינו שולח פניות.</p>
<section class="demo-row"><label>ברירת מחדל</label><div class="demo-preview"><input aria-label="שם מלא — ברירת מחדל"  placeholder="שם מלא"><button type="button" class="pp-primary form-submit " >יאללה, הופכים את הרעיון לחולצה!</button></div></section>
<section class="demo-row"><label>מעבר עכבר</label><div class="demo-preview"><input aria-label="שם מלא — מעבר עכבר"  placeholder="שם מלא"><button type="button" class="pp-primary form-submit is-hover" >יאללה, הופכים את הרעיון לחולצה!</button></div></section>
<section class="demo-row"><label>מיקוד מקלדת</label><div class="demo-preview"><input aria-label="שם מלא — מיקוד מקלדת" class="is-focus" placeholder="שם מלא"><button type="button" class="pp-primary form-submit is-focus" >יאללה, הופכים את הרעיון לחולצה!</button></div></section>
<section class="demo-row"><label>לחיצה</label><div class="demo-preview"><input aria-label="שם מלא — לחיצה"  placeholder="שם מלא"><button type="button" class="pp-primary form-submit is-active" >יאללה, הופכים את הרעיון לחולצה!</button></div></section>
<section class="demo-row"><label>לא זמין</label><div class="demo-preview"><input aria-label="שם מלא — לא זמין" disabled placeholder="שם מלא"><button type="button" class="pp-primary form-submit " disabled>יאללה, הופכים את הרעיון לחולצה!</button></div></section>
<section class="demo-row"><label>בטעינה</label><div class="demo-preview"><input aria-label="שם מלא — בטעינה" disabled aria-busy="true" placeholder="שם מלא"><button type="button" class="pp-primary form-submit " disabled aria-busy="true">הרעיון שלכם בדרך לסטודיו…</button></div></section>
<section class="demo-row"><label>שגיאה</label><div class="demo-preview"><input aria-label="שם מלא — שגיאה" aria-invalid="true" aria-describedby="demo-error" placeholder="שם מלא"><button type="button" class="pp-primary form-submit " >יאללה, הופכים את הרעיון לחולצה!</button><p id="demo-error" class="pp-field-error">מלאו שם כדי שנדע למי לחזור.</p></div></section>
<section class="demo-row"><label>הצלחה</label><div class="demo-preview"><input aria-label="שם מלא — הצלחה" value="הפרטים מוכנים" placeholder="שם מלא"><button type="button" class="pp-primary form-submit " >יאללה, הופכים את הרעיון לחולצה!</button><p class="pp-saved-status">✓ הפנייה נשמרה בסטודיו</p></div></section></main></html>
