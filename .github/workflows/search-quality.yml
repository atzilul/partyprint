name: Search discovery quality
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: node --test scripts/search-utils.test.mjs scripts/search-metrics.test.mjs scripts/build-identity.test.mjs scripts/order-quantity.test.mjs scripts/quote-planning.test.mjs
      - run: node --experimental-strip-types --test scripts/search-content.test.mjs scripts/analytics-contract.test.mjs scripts/meta-capi.test.mjs
      - name: PartyPrint branded email templates and Resend delivery guard
        run: node scripts/verify-order-mail.mjs
      - name: Resend payload and delivery failure contract; fetch mocked, no real emails
        run: node scripts/verify-mail-delivery.mjs
      - name: Isolated order API regression; synthetic storage and no external mail
        run: node scripts/verify-orders.mjs
      - run: node scripts/verify-immutable-media.mjs
      - run: npm run build
      - name: Install isolated browser QA tooling
        run: npm install --prefix /tmp/partyprint-browser --no-save --package-lock=false --ignore-scripts playwright@1.64.1
      - run: /tmp/partyprint-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node scripts/check-search-build.mjs
        env:
          PARTYPRINT_BROWSER_CHECK: '1'
          PARTYPRINT_PLAYWRIGHT_ROOT: /tmp/partyprint-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-local-report
          path: artifacts/*.json
          if-no-files-found: ignore
  production-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-public-routing.mjs
      - run: node --experimental-strip-types scripts/check-discovery-details.mjs
      - run: node scripts/check-release-identity.mjs
      - name: Read-only production audit (findings do not deploy anything)
        run: node scripts/audit-search.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-production-report
          path: |
            artifacts/search-audit.json
            artifacts/public-routing.json
            artifacts/discovery-details.json
            artifacts/release-identity.json
          if-no-files-found: error
  production-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser QA tooling
        run: npm install --prefix /tmp/partyprint-browser --no-save --package-lock=false --ignore-scripts playwright@1.64.1
      - run: /tmp/partyprint-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Public non-mutating price quote and thanks noindex
        run: node scripts/check-public-quote.mjs
      - name: Public form interaction; all writes blocked
        run: node scripts/check-order-browser.mjs
        env:
          PARTYPRINT_PLAYWRIGHT_ROOT: /tmp/partyprint-browser
      - name: Quantity and tier pricing; writes mocked, matching deployment required to exercise feature
        run: node scripts/check-quantity-browser.mjs
        env:
          PARTYPRINT_PLAYWRIGHT_ROOT: /tmp/partyprint-browser
      - name: Mobile UX recovery, quote loading and size conflicts; all writes mocked
        run: node scripts/check-form-ux-browser.mjs
        env:
          PARTYPRINT_PLAYWRIGHT_ROOT: /tmp/partyprint-browser
      - name: Isolated measurement contract; vendors and order responses mocked
        run: node scripts/check-measurement-browser.mjs
        env:
          PARTYPRINT_PLAYWRIGHT_ROOT: /tmp/partyprint-browser
      - name: Public responsive media, font subsets and cache policy; matching source required
        run: node scripts/check-media-browser.mjs
        env:
          PARTYPRINT_PLAYWRIGHT_ROOT: /tmp/partyprint-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order-production-browser
          path: |
            artifacts/public-quote.json
            artifacts/ux-browser-production.json
            artifacts/order-browser-production.json
            artifacts/measurement-contract-production.json
            artifacts/quantity-browser-production.json
            artifacts/immutable-media-production.json
          if-no-files-found: error

  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-dependencies.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: artifacts/dependency-audit-*.json
          if-no-files-found: error
