name: Verify PartyPrint security update
on:
  push:
    branches:
      - security/hostinger-vulnerability-fixes-2026-10
    paths:
      - .github/workflows/site-smoke.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --version && npm --version
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm run build
      - name: Smoke-check local public routes and analytics API
        run: |
          set -euo pipefail
          HOST=127.0.0.1 PORT=3333 npm run start > /tmp/partyprint-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3333/ >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/partyprint-smoke.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/partyprint-smoke.log
            exit 1
          fi
          routes=(/ /about /work /guides /faq /policies/shipping /policies/returns /privacy-policy /robots.txt)
          for path in "${routes[@]}"; do
            status=$(curl --location --silent --show-error -o /tmp/partyprint-route.html -w '%{http_code}' "http://127.0.0.1:3333$path")
            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "Route $path returned HTTP $status"
              cat /tmp/partyprint-smoke.log
              exit 1
            fi
          done
          curl --fail --silent --show-error http://127.0.0.1:3333/api/analytics-config -o /tmp/partyprint-analytics.json
          node --input-type=module -e "const value=JSON.parse(await (await import('node:fs/promises')).readFile('/tmp/partyprint-analytics.json','utf8')); if(typeof value.measurementId!=='string'||typeof value.metaPixelId!=='string'||typeof value.country!=='string') throw new Error('Analytics config response shape changed');"
          headers=$(curl --fail --silent --show-error -I http://127.0.0.1:3333/)
          printf '%s\n' "$headers" | grep -qi '^x-content-type-options: nosniff'
          printf '%s\n' "$headers" | grep -qi '^content-security-policy:'
          echo "HTTP smoke check passed: ${#routes[@]} public routes, analytics config and security headers."