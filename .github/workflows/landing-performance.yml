name: Landing performance laboratory
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'public/landing/**'
      - 'public/fonts/**'
      - 'scripts/check-landing-*.mjs'
      - '.github/workflows/landing-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm install --prefix /tmp/partyprint-browser --no-save --package-lock=false --ignore-scripts playwright@1.64.1
      - run: /tmp/partyprint-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node scripts/check-landing-build.mjs
        env:
          PERF_SAMPLES: '3'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-performance-candidate
          path: artifacts/landing-performance.json
          if-no-files-found: error
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm install --prefix /tmp/partyprint-browser --no-save --package-lock=false --ignore-scripts playwright@1.64.1
      - run: /tmp/partyprint-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node scripts/check-landing-performance.mjs
        env:
          PERF_SAMPLES: '3'
          PERF_EXPECT_OPTIMIZED: auto
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-performance-production
          path: artifacts/landing-performance.json
          if-no-files-found: error
