name: Inspect immutable media serving
on:
  push:
    branches: ['codex/landing-assets-cache-2026-11-02']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm ci --no-audit --no-fund
      - name: Inspect installed static server and public baseline
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,readdirSync} from 'node:fs';
          import {dirname,join} from 'node:path';
          const entry=new URL(import.meta.resolve('vinext/server/prod-server'));
          const source=readFileSync(entry,'utf8');
          console.log('PROD_SERVER '+source);
          function scan(dir){for(const item of readdirSync(dir,{withFileTypes:true})){const path=join(dir,item.name);if(item.isDirectory())scan(path);else if(item.name.endsWith('.js')){const lines=readFileSync(path,'utf8').split('\n');for(let i=0;i<lines.length;i++)if(/max-age=3600|cacheControl|immutable|serveStaticFile|apply.*Headers/.test(lines[i]))console.log('STATIC_DEP '+path.split('/node_modules/')[1]+'\n'+lines.slice(Math.max(0,i-5),i+9).join('\n'))}}}
          scan(dirname(entry.pathname));
          for(const path of ['/api/release','/landing/party-crew-960.avif','/fonts/rubik-600.woff2','/transformation.webp']){
            try{const r=await fetch('https://partyprint.co.il'+path,{signal:AbortSignal.timeout(10000)});console.log('PUBLIC_BASELINE '+JSON.stringify({path,status:r.status,cacheControl:r.headers.get('cache-control'),...(path==='/api/release'?{release:await r.json()}:{bytes:(await r.arrayBuffer()).byteLength})}))}catch(e){console.log('PUBLIC_BASELINE '+JSON.stringify({path,error:e.cause?.code||e.message}))}
          }
          NODE
